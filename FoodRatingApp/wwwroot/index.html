<!DOCTYPE html>
<html>
<head>
    <title>S&PE Tech Test</title>
    <link rel="stylesheet" href="assets/bootstrap.min.css">
    <link rel="stylesheet" href="assets/style.css">
    <link rel="icon" type="image/png" href="assets/favicon1.png" />

</head>
<body>
<div class="cover-container d-flex h-100 p-3 mx-auto flex-column">
    <header class="masthead mb-auto">
        <div class="inner">
            <h3 class="masthead-brand">S&PE Tech Test</h3>
        </div>
    </header>

    <main role="main" class="inner cover">
        <h1 class="cover-heading">Food Agency Data Summarizer.</h1>
        <p class="lead">This summarizer will take take all the data from a specific authority, and show you how the food
            hygiene ratings are distributed.</p>
        <p><label> Select an Authority:
            <select class="js-authority-select">
                <!-- auto filled in, one page at a time -->
            </select>
        </label></p>
        <p class="js-pager" hidden>
            <button type="button" class="btn btn-sm btn-secondary js-prev-page">&laquo; Previous</button>
            <span class="mx-2 js-page-label">Page 1</span>
            <button type="button" class="btn btn-sm btn-secondary js-next-page">Next &raquo;</button>
        </p>
        <table class="table table-dark table-striped">
            <thead>
            <tr>
                <th>Rating</th>
                <th>Percentage</th>
            </tr>
            </thead>
            <tbody class="js-authority-table">
                <!-- auto filled in -->
            </tbody>
        </table>

    </main>

    <footer class="mastfoot mt-auto">
        <div class="inner text-center">
            <p>
                <span class="accent">Software &amp; Platform Engineering</span>
                <span>- Full Stack Tech Test.</span>
            </p>
        </div>
    </footer>
</div>

<script>
    (async () => {

        const escapeHtml = (text) => String(text).replace(/[&<>"']/g, c => `&#${c.charCodeAt(0)};`);

        // Turns an error response (ProblemDetails) into a message for the user.
        const errorMessage = async (response) => {
            const problem = await response.json().catch(() => ({}));
            return `${problem.title ?? 'Something went wrong'}. ${problem.detail ?? 'Please try again.'}`;
        };

        const showError = (message) => {
            document.querySelector('.js-authority-table').innerHTML =
                `<tr><td colspan="2" class="text-warning">&#9888; ${escapeHtml(message)}</td></tr>`;
        };

        const loadAuthority = async (id) => {
            let response;
            try {
                response = await fetch(`/api/${id}`);
            } catch {
                return showError('Could not reach the server. Check your connection and try again.');
            }
            if (!response.ok) {
                return showError(await errorMessage(response));
            }
            const ratings = await response.json();
            const table = document.querySelector('.js-authority-table');
            table.innerHTML = '';
            ratings.map(rating => table.innerHTML += `<tr>
                <td>${rating.name}</td>
                <td>${rating.value.toFixed(1)}%</td>
            </tr>`);
        };

        const select = document.querySelector('.js-authority-select');
        const pager = document.querySelector('.js-pager');
        const prevButton = document.querySelector('.js-prev-page');
        const nextButton = document.querySelector('.js-next-page');
        const pageLabel = document.querySelector('.js-page-label');
        select.addEventListener('change', (e) => loadAuthority(e.target.value));

        // Paging is driven from here: each click requests just that page from /api?page=N.
        let currentPage = 0;
        let hasPrevious = false;
        let hasNext = false;

        const updatePager = (busy = false) => {
            pager.hidden = false;
            pageLabel.textContent = busy ? 'Loading...' : `Page ${currentPage}`;
            prevButton.disabled = busy || !hasPrevious;
            nextButton.disabled = busy || !hasNext;
        };

        // Fetches one page of authorities and shows it in the dropdown, replacing the previous page.
        const showAuthorityPage = async (pageNumber) => {
            updatePager(true);
            let response;
            try {
                response = await fetch(`/api?page=${pageNumber}`);
            } catch {
                updatePager();
                return showError('Could not reach the server. Check your connection and try again.');
            }
            if (!response.ok) {
                updatePager();
                return showError(await errorMessage(response));
            }
            const page = await response.json();

            // A full last page reports hasNext; the page after it is empty, so stay where we are.
            if (page.items.length === 0 && pageNumber > 1) {
                hasNext = false;
                return updatePager();
            }

            select.innerHTML = '';
            page.items.forEach(authority => select.add(new Option(authority.name, authority.id)));
            currentPage = page.page;
            hasPrevious = page.hasPrevious;
            hasNext = page.hasNext;
            updatePager();

            if (select.options.length > 0) {
                loadAuthority(select.options[0].value);
            }
        };

        prevButton.addEventListener('click', () => showAuthorityPage(currentPage - 1));
        nextButton.addEventListener('click', () => showAuthorityPage(currentPage + 1));

        select.innerHTML = '';
        await showAuthorityPage(1);
    })();
</script>

</body>
</html>
